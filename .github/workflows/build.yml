name: Build

# Push a tag such as v0.1.0 (matching "version" in package.json) to build
# every platform and publish a GitHub release with the installers. Run it
# from the Actions tab ("Run workflow") to only build, and download the
# results from the run's artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # the release, and the uploads to it

jobs:
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version package.json)"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    # Runs for tags after the draft exists, and alone for manual runs.
    if: ${{ !failure() && !cancelled() }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # MyGo needs no cgo: Ubuntu cross-compiles Windows, NSIS makes the installers.
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          # macOS needs a Mac for the .app, the disk image and the Icon Composer icon.
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build
        run: bun run build -- -platform "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v7
        with:
          name: smovie-${{ matrix.name }}
          if-no-files-found: error
          path: |
            build/*/*.dmg
            build/*/*-setup-*.exe
            build/*/*.deb
            build/*/*.tar.gz
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" --clobber \
            build/*/*.dmg build/*/*-setup-*.exe build/*/*.deb build/*/*.tar.gz

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
