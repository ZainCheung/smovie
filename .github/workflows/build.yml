name: Build

# Push a tag such as v0.1.0 (matching "version" in package.json) to build
# every platform and publish a GitHub release with the installers. Run it
# from the Actions tab ("Run workflow") to only build, and download the
# results from the run's artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # the release, and the uploads to it

jobs:
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version package.json)"
      # The update window shows this section, and the builds fail without it.
      - name: Check the changelog has the version
        run: grep -q "^## \[\?$(jq -r .version package.json)\b" CHANGELOG.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    # Runs for tags after the draft exists, and alone for manual runs.
    if: ${{ !failure() && !cancelled() }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # MyGo needs no cgo: Ubuntu cross-compiles Windows, NSIS makes the installers.
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          # macOS needs a Mac for the .app, the disk image and the Icon Composer icon.
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      # What mygo.config.ts signs and notarizes with, for this job alone.
      - name: Import the certificate and the notary credentials
        if: matrix.name == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          # A .p12 from Keychain Access holds no intermediate certificate.
          # Developer IDs issued before 2027 chain to the first, later ones
          # to G2.
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL -o "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" -T /usr/bin/codesign
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/key.p8"
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --key "$RUNNER_TEMP/key.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          rm "$RUNNER_TEMP/key.p8"
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      # The key signs the updates that installed apps download (updates in
      # mygo.config.ts): the archives, the deltas from the versions before,
      # and the manifests that name them. Without it the build makes none.
      - name: Build
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: bun run build -- -platform "${{ matrix.platform }}"
      - name: Check the build made its updates
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          for target in $(echo "${{ matrix.platform }}" | tr ',/' ' -'); do
            test -s "build/$target/update-$target.json" || { echo "no update manifest for $target"; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: smovie-${{ matrix.name }}
          if-no-files-found: error
          path: |
            build/*/*.dmg
            build/*/*-setup-*.exe
            build/*/*.deb
            build/*/*.tar.gz
            build/*/*.delta
            build/*/update-*.json
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" --clobber \
            build/*/*.dmg build/*/*-setup-*.exe build/*/*.deb build/*/*.tar.gz build/*/*.delta
          # The manifests last: apps read them from the latest release.
          gh release upload "$GITHUB_REF_NAME" --clobber build/*/update-*.json

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
