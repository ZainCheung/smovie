name: Live Contract

# Daily live verification against upstream Hongguo APIs: catalog, search,
# episodes, playback resolution, CENC decryption, and ffmpeg frame decode.
# Uploads only redacted shape/metric summaries (never URLs, IDs, or keys).
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install ffmpeg for frame decode check
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run offline unit tests
        run: CGO_ENABLED=0 go test -count=1 ./...
      - name: Run live contract check
        env:
          SMOVIE_LIVE: "1"
          SMOVIE_CONTRACT_OUT: ${{ runner.temp }}/contract
        run: CGO_ENABLED=0 go test -count=1 -run TestLiveContract -v ./internal/hongguo
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-summary
          path: ${{ runner.temp }}/contract
          if-no-files-found: ignore
