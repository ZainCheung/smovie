name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: |
          for os in linux windows darwin; do
            CGO_ENABLED=0 GOOS=$os go vet ./...
          done
      - name: Test
        run: CGO_ENABLED=0 go test ./...
